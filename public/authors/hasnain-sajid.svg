<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Navy & Azure -->
    <linearGradient id="hs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Warm Gold Gradient Matching Umar & Kainat -->
    <linearGradient id="hs-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Natural Warm Skin Tone -->
    <linearGradient id="hs-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="200" rx="40" fill="url(#hs-bg)" />

  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#hs-gold)" stroke-width="3" stroke-dasharray="6,3" opacity="0.65" />

  <!-- Body / Navy Blazer -->
  <path d="M45 190 C45 140, 70 128, 100 128 C130 128, 155 140, 155 190 Z" fill="#0f172a" />

  <!-- Crisp White Shirt Collar -->
  <path d="M82 128 L100 170 L118 128 Z" fill="#ffffff" />

  <!-- Royal Blue Tie with Gold Accent -->
  <path d="M96 142 L104 142 L102 186 L98 186 Z" fill="#0284c7" />
  <circle cx="100" cy="148" r="2" fill="url(#hs-gold)" />

  <!-- Lapel Shadow Lines -->
  <path d="M72 136 L88 170" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M128 136 L112 170" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Neck -->
  <rect x="88" y="104" width="24" height="26" rx="6" fill="url(#hs-skin)" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="78" rx="28" ry="32" fill="url(#hs-skin)" />

  <!-- Styled Modern Hair -->
  <path d="M68 68 C68 45, 82 38, 100 38 C122 38, 134 46, 132 68 C124 52, 114 46, 98 46 C82 46, 72 54, 68 68 Z" fill="#18181b" />

  <!-- Eyes with Catchlights -->
  <circle cx="89" cy="76" r="3" fill="#18181b" />
  <circle cx="111" cy="76" r="3" fill="#18181b" />
  <circle cx="90" cy="75" r="1" fill="#ffffff" />
  <circle cx="112" cy="75" r="1" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M83 69 Q89 66 95 69" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M105 69 Q111 66 117 69" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Warm, Clean Smile -->
  <path d="M93 92 Q100 97 107 92" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>
