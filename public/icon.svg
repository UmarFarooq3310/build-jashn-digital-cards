<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <!-- Top-left shine overlay -->
  <rect width="180" height="180" rx="42" fill="url(#shine)"/>

  <!-- Card body -->
  <rect x="32" y="54" width="116" height="76" rx="14" fill="white" fill-opacity="0.15" stroke="white" stroke-width="5" stroke-linejoin="round"/>

  <!-- Envelope flap line -->
  <path d="M32 68 L90 97 L148 68" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Heart centred on card -->
  <path d="M90 117 C90 117 72 102 72 91 C72 84 77 79 84 79 C87 79 89 81 90 83 C91 81 93 79 96 79 C103 79 108 84 108 91 C108 102 90 117 90 117Z" fill="white" fill-opacity="0.85"/>

  <!-- Sparkle top-right -->
  <path d="M137 36 C137 41 140 44 145 44 C140 44 137 47 137 52 C137 47 134 44 129 44 C134 44 137 41 137 36Z" fill="url(#spark)"/>

  <!-- Small sparkle bottom-left -->
  <path d="M44 137 C44 141 46 142 49 142 C46 142 44 144 44 148 C44 144 42 142 39 142 C42 142 44 141 44 137Z" fill="url(#spark)" opacity="0.7"/>
</svg>